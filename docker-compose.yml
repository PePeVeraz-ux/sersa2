version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sersa-db
    restart: always
    environment:
      POSTGRES_DB: sersa_db
      POSTGRES_USER: sersa_user
      POSTGRES_PASSWORD: sersa_password
    ports:
      - "5432:5432"
    volumes:
      - sersa-postgres-data:/var/lib/postgresql/data

volumes:
  sersa-postgres-data: