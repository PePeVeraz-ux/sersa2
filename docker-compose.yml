version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: sersa-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sersa_db
      MYSQL_USER: sersa_user
      MYSQL_PASSWORD: sersa_password
    ports:
      - '3307:3306'
    volumes:
      - sersa-mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  sersa-mysql-data:
